<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniTrack</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <nav class="nav-bar">
      <span class="brand">UniTrack</span>
      <button class="nav-btn active" data-view="tasks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/><path d="M9 14l2 2 4-4"/></svg>
        Tareas
      </button>
      <button class="nav-btn" data-view="notes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        Notas
      </button>
      <button class="nav-btn" data-view="timeline">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        Timeline
      </button>
      <button class="nav-btn" data-view="finanzas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
        Finanzas
      </button>
      <div class="sync-indicator" id="sync-indicator" title="Estado de sincronización">
        <span class="sync-icon" id="sync-icon">↻</span>
        <span class="sync-pending hidden" id="sync-pending">0</span>
        <span class="sync-dot online" id="sync-dot"></span>
      </div>
      <div class="nav-spacer"></div>
      <div class="nav-actions">
        <button class="btn-icon primary" id="btn-add" title="Agregar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="btn-icon" id="btn-search" title="Buscar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        </button>
      </div>
    </nav>

    <div id="view-tasks" class="view-container"></div>
    <div id="view-notes" class="view-container hidden"></div>
    <div id="view-timeline" class="view-container hidden"></div>
    <div id="view-finanzas" class="view-container hidden"></div>
  </div>

  <div class="detail-panel" id="detail-panel">
    <div class="panel-header">
      <h3 id="panel-title">Detalle</h3>
      <button class="panel-close" id="panel-close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="panel-body" id="panel-body"></div>
    <div class="panel-actions" id="panel-actions"></div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Nuevo elemento</h2>
        <button class="panel-close" id="modal-close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="modal-cancel">Cancelar</button>
        <button class="btn btn-primary" id="modal-save">Guardar</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-md">
    <div class="modal" style="width:520px;">
      <div class="modal-header">
        <h2>Markdown Cheatsheet</h2>
        <button class="panel-close" id="modal-md-close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" style="font-size:13px;line-height:1.8;">
        <table style="width:100%;border-collapse:collapse;">
          <tr><td style="padding:4px 8px;font-weight:600;"># Título</td><td style="padding:4px 8px;color:var(--text-secondary);">Heading 1</td></tr>
          <tr><td style="padding:4px 8px;font-weight:600;">## Título</td><td style="padding:4px 8px;color:var(--text-secondary);">Heading 2</td></tr>
          <tr><td style="padding:4px 8px;font-weight:600;">### Título</td><td style="padding:4px 8px;color:var(--text-secondary);">Heading 3</td></tr>
          <tr><td style="padding:4px 8px;font-weight:600;">**texto**</td><td style="padding:4px 8px;color:var(--text-secondary);"><strong>Negrita</strong></td></tr>
          <tr><td style="padding:4px 8px;font-weight:600;">*texto*</td><td style="padding:4px 8px;color:var(--text-secondary);"><em>Cursiva</em></td></tr>
          <tr><td style="padding:4px 8px;font-weight:600;">- item</td><td style="padding:4px 8px;color:var(--text-secondary);">Lista desordenada</td></tr>
          <tr><td style="padding:4px 8px;font-weight:600;">1. item</td><td style="padding:4px 8px;color:var(--text-secondary);">Lista ordenada</td></tr>
          <tr><td style="padding:4px 8px;font-weight:600;">`código`</td><td style="padding:4px 8px;color:var(--text-secondary);"><code>Código inline</code></td></tr>
          <tr><td style="padding:4px 8px;font-weight:600;">```bloque```</td><td style="padding:4px 8px;color:var(--text-secondary);">Bloque de código</td></tr>
          <tr><td style="padding:4px 8px;font-weight:600;">[texto](url)</td><td style="padding:4px 8px;color:var(--text-secondary);">Enlace</td></tr>
          <tr><td style="padding:4px 8px;font-weight:600;">---</td><td style="padding:4px 8px;color:var(--text-secondary);">Línea horizontal</td></tr>
        </table>
      </div>
    </div>
  </div>

  <div id="tag-results" class="view-container hidden"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
